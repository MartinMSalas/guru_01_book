name: Java CI with Maven

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      database:
        image: mysql:latest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 20s
          --health-timeout 10s
          --health-retries 5
        env:
          MYSQL_DATABASE: "spring"
          MYSQL_PASSWORD: "password"
          MYSQL_ROOT_PASSWORD: "password"

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_HOST: localhost
      DB_PORT: 3306
    

